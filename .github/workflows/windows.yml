name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Unit tests
        run: npm test
      - name: Desktop integration tests
        run: npm run test:e2e
      - name: Build Windows x64 portable ZIP and installer
        run: npm run dist:win
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: LocalVideoLibrary-Windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Upload test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalVideoLibrary-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --title "拾影 $RELEASE_TAG" --generate-notes
